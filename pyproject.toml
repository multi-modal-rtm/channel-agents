[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "channel-agents"
version = "0.1.0"
description = "Multi-tenant AI sales automation for Instagram/Telegram (Uzbekistan SMEs)"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    # Validation / settings
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    # Encryption
    "cryptography>=43.0.0",
    # LLM
    "anthropic>=0.40.0",
    # Vector store
    "qdrant-client>=1.12.0",
    # Cache / queue — using arq (native async, Redis-backed, no sync bridging)
    "redis>=5.2.0",
    "arq>=0.26.1",
    # Observability
    "langfuse>=2.57.0",
    "structlog>=24.4.0",
    # Templating
    "jinja2>=3.1.4",
    # HTTP client
    "httpx>=0.27.0",
    # Retry with exponential backoff
    "tenacity>=9.0.0",
    # Phone normalisation
    "phonenumbers>=8.13.50",
    # Metrics
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "anyio>=4.6.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
